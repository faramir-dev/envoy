static_resources:
  listeners:
    - address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                route_config:
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend }
                http_filters:
                  - name: envoy.filters.http.ringcache
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ringcache.v3.RingCacheConfig
                      # A single partition keeps FIFO eviction deterministic; with
                      # the default 64 partitions two keys would usually hash to
                      # different partitions and never evict each other.
                      num_partitions: 1
                      # Roughly one lab entry (600-byte body + key + headers)
                      # fits; a second insert evicts the first.
                      partition_max_bytes: 800
                      # 900-byte bodies pass this watermark, 100 KB bodies do not.
                      max_cacheable_body_bytes: 1024
                      key_config:
                        additional_headers:
                          - x-tenant
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      type: STRICT_DNS
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8000 }
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
